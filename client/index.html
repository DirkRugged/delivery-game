<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px;
        color: #fff; font: 14px/1.6 monospace;
        text-shadow: 1px 1px 2px #000;
        pointer-events: none;
      }
      #scores {
        position: fixed; top: 12px; right: 12px;
        color: #fff; font: 13px/1.8 monospace;
        text-shadow: 1px 1px 2px #000;
        text-align: right;
        pointer-events: none;
      }
      #controls {
        position: fixed; bottom: 12px; left: 12px;
        color: #aaa; font: 12px monospace;
        pointer-events: none;
      }
      #focus-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.6);
        color: #fff; font: bold 22px monospace;
        align-items: center; justify-content: center;
        cursor: pointer;
        z-index: 10;
      }
      #focus-overlay.visible { display: flex; }
    </style>
  </head>
  <body>
    <div id="focus-overlay" class="visible">Click to activate controls</div>
    <div id="hud">
      <div id="status">Connecting…</div>
      <div id="score">Score: 0</div>
      <div id="package-status"></div>
    </div>
    <div id="scores"></div>
    <div id="controls">WASD / Arrow keys — drive &nbsp;|&nbsp; SPACE — pick up / deliver</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
